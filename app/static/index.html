<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass Smart Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <button id="glass-toggle" class="glass-toggle glass ripple" type="button" aria-expanded="false">
        <i class="fa-solid fa-sliders"></i> Glass Engine
      </button>

      <aside id="glass-panel" class="glass-panel glass" aria-hidden="true">
        <h3>Glass Engine</h3>
        <label class="control">
          <span>Blur</span>
          <input id="glass-blur" type="range" min="8" max="36" value="25" />
        </label>
        <label class="control">
          <span>Opacity</span>
          <input id="glass-opacity" type="range" min="4" max="22" value="8" />
        </label>
        <label class="control">
          <span>Saturation</span>
          <input id="glass-sat" type="range" min="110" max="220" value="160" />
        </label>
        <button id="random-theme-btn" class="mini-btn ripple" type="button">Random Theme</button>
      </aside>

      <!-- Top room navigation -->
      <nav class="top-pills glass" aria-label="Room navigation">
        <button class="pill is-active" type="button" data-room="Living Room">Living Room</button>
        <button class="pill" type="button" data-room="Bath Room">Bath Room</button>
        <button class="pill" type="button" data-room="Kitchen">Kitchen</button>
        <button class="pill" type="button" data-room="Bed Room">Bed Room</button>
        <button class="pill" type="button" data-room="Play Room">Play Room</button>
      </nav>

      <section class="dashboard glass">
        <!-- Floating sidebar -->
        <aside class="sidebar glass" aria-label="Quick apps">
          <button class="icon-btn is-active ripple" type="button" aria-label="Home"><i class="fa-solid fa-house"></i></button>
          <button class="icon-btn ripple" type="button" aria-label="Calendar"><i class="fa-regular fa-calendar"></i></button>
          <button class="icon-btn ripple" type="button" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></button>
          <button class="icon-btn ripple" type="button" aria-label="Browser"><i class="fa-solid fa-globe"></i></button>
        </aside>

        <!-- Room stage (injected by JS) -->
        <section id="room-stage" class="room-stage"></section>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
