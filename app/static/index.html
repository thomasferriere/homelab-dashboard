<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass Smart Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <button id="glass-toggle" class="glass-toggle glass ripple" type="button" aria-expanded="false">
        <i class="fa-solid fa-sliders"></i> Glass Engine
      </button>

      <aside id="glass-panel" class="glass-panel glass" aria-hidden="true">
        <h3>Glass Engine</h3>
        <label class="control">
          <span>Blur</span>
          <input id="glass-blur" type="range" min="8" max="36" value="25" />
        </label>
        <label class="control">
          <span>Opacity</span>
          <input id="glass-opacity" type="range" min="4" max="22" value="8" />
        </label>
        <label class="control">
          <span>Saturation</span>
          <input id="glass-sat" type="range" min="110" max="220" value="160" />
        </label>
        <button id="random-theme-btn" class="mini-btn ripple" type="button">Random Theme</button>
      </aside>

      <!-- Top room navigation -->
      <div class="top-pills-wrap">
        <nav class="top-pills glass" aria-label="Room navigation">
          <button class="pill home-pill" type="button" data-room="Home" aria-label="Home">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
          </button>
          <button class="pill is-active" type="button" data-room="Living Room">Living Room</button>
          <button class="pill" type="button" data-room="Bath Room">Bath Room</button>
          <button class="pill" type="button" data-room="Kitchen">Kitchen</button>
          <button class="pill" type="button" data-room="Bed Room">Bed Room</button>
          <button class="pill" type="button" data-room="Play Room">Play Room</button>
        </nav>
      </div>

      <section class="dashboard glass">
        <!-- Floating sidebar -->
        <aside class="sidebar glass" aria-label="Quick apps">
          <button class="icon-btn is-active ripple" type="button" aria-label="Home" data-app="home"><i class="fa-solid fa-house"></i></button>
          <button class="icon-btn ripple" type="button" aria-label="Cameras" data-app="cameras"><i class="fa-solid fa-video"></i></button>
          <button class="icon-btn ripple" type="button" aria-label="Terminal" data-app="terminal"><i class="fa-solid fa-terminal"></i></button>
          <button class="icon-btn ripple" type="button" aria-label="Network" data-app="network"><i class="fa-solid fa-wifi"></i></button>
          <button class="icon-btn ripple" type="button" aria-label="Energy" data-app="energy"><i class="fa-solid fa-bolt"></i></button>
          <button class="icon-btn ripple" type="button" aria-label="Alerts" data-app="alerts"><i class="fa-solid fa-bell"></i></button>
          <button class="icon-btn ripple" type="button" aria-label="Scenes" data-app="scenes"><i class="fa-solid fa-sliders"></i></button>
          <button class="icon-btn ripple" type="button" aria-label="Music" data-app="music"><i class="fa-solid fa-music"></i></button>
          <button class="icon-btn ripple" type="button" aria-label="Security" data-app="security"><i class="fa-solid fa-shield-halved"></i></button>
          <button class="icon-btn ripple" type="button" aria-label="Storage" data-app="storage"><i class="fa-solid fa-hard-drive"></i></button>
          <button class="icon-btn ripple" type="button" aria-label="Weather" data-app="weather"><i class="fa-solid fa-cloud-sun"></i></button>
        </aside>

        <aside id="quick-panel" class="quick-panel glass" role="dialog" aria-hidden="true" aria-label="Quick app">
          <div class="quick-panel-head">
            <h3 id="quick-panel-title">Quick App</h3>
            <button id="quick-panel-close" class="mini-btn ripple" type="button" aria-label="Close">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div id="quick-panel-body" class="quick-panel-body"></div>
        </aside>

        <!-- Room stage (injected by JS) -->
        <section id="room-stage" class="room-stage"></section>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
